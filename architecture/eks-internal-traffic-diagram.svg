<svg viewBox="0 0 1400 1020" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#212121"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#757575"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1020" fill="#ffffff"/>
  <text x="700" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">EKS Internal Traffic Flow — ALB to Pods and Back (Production)</text>
  <text x="700" y="44" text-anchor="middle" font-size="11" fill="#555555">Solid = data plane, both directions (request out, response back on the same connection) · Dashed = Kubernetes control plane, no traffic</text>

  <!-- Client -->
  <circle cx="700" cy="85" r="18" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
  <text x="700" y="89" text-anchor="middle" font-size="9" fill="#212121">Client</text>
  <line x1="700" y1="103" x2="700" y2="121" stroke="#212121" stroke-width="2" marker-end="url(#arrowBlack)" marker-start="url(#arrowBlack)"/>

  <!-- ALB -->
  <rect x="450" y="121" width="500" height="68" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="700" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">Application Load Balancer</text>
  <text x="700" y="163" text-anchor="middle" font-size="10.5" fill="#0d47a1">/api/* → backend-tg (priority 1)</text>
  <text x="700" y="179" text-anchor="middle" font-size="10.5" fill="#0d47a1">/*     → frontend-tg (default)</text>

  <path d="M550,189 C450,210 350,215 350,233" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrowBlack)" marker-start="url(#arrowBlack)"/>
  <path d="M850,189 C950,210 1050,215 1050,233" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrowBlack)" marker-start="url(#arrowBlack)"/>

  <!-- Target groups -->
  <rect x="150" y="235" width="400" height="55" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="350" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">frontend-tg</text>
  <text x="350" y="273" text-anchor="middle" font-size="10" fill="#0d47a1">Target type: IP · health check: /healthz</text>

  <rect x="850" y="235" width="400" height="55" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="1050" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">backend-tg</text>
  <text x="1050" y="273" text-anchor="middle" font-size="10" fill="#0d47a1">Target type: IP · health check: /healthz</text>

  <!-- TG -> Pods arrows -->
  <path d="M215,290 C215,310 175,320 175,338" fill="none" stroke="#212121" stroke-width="1.5" marker-end="url(#arrowBlack)" marker-start="url(#arrowBlack)"/>
  <line x1="350" y1="290" x2="340" y2="338" stroke="#212121" stroke-width="1.5" marker-end="url(#arrowBlack)" marker-start="url(#arrowBlack)"/>
  <path d="M485,290 C485,310 465,320 465,338" fill="none" stroke="#212121" stroke-width="1.5" marker-end="url(#arrowBlack)" marker-start="url(#arrowBlack)"/>

  <path d="M915,290 C915,310 915,320 915,338" fill="none" stroke="#212121" stroke-width="1.5" marker-end="url(#arrowBlack)" marker-start="url(#arrowBlack)"/>
  <line x1="1050" y1="290" x2="1040" y2="338" stroke="#212121" stroke-width="1.5" marker-end="url(#arrowBlack)" marker-start="url(#arrowBlack)"/>
  <path d="M1185,290 C1185,310 1165,320 1165,338" fill="none" stroke="#212121" stroke-width="1.5" marker-end="url(#arrowBlack)" marker-start="url(#arrowBlack)"/>

  <!-- Frontend Pods -->
  <rect x="160" y="338" width="110" height="65" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="215" y="358" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">Frontend Pod</text>
  <text x="215" y="373" text-anchor="middle" font-size="9" fill="#1b5e20">10.1.2.11:80</text>
  <text x="215" y="388" text-anchor="middle" font-size="9" fill="#2e7d32">Ready ✓</text>

  <rect x="285" y="338" width="110" height="65" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="340" y="358" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">Frontend Pod</text>
  <text x="340" y="373" text-anchor="middle" font-size="9" fill="#1b5e20">10.1.2.34:80</text>
  <text x="340" y="388" text-anchor="middle" font-size="9" fill="#2e7d32">Ready ✓</text>

  <rect x="410" y="338" width="110" height="65" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="465" y="358" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">Frontend Pod</text>
  <text x="465" y="373" text-anchor="middle" font-size="9" fill="#1b5e20">10.1.3.02:80</text>
  <text x="465" y="388" text-anchor="middle" font-size="9" fill="#2e7d32">Ready ✓</text>

  <!-- Backend Pods -->
  <rect x="860" y="338" width="110" height="65" rx="6" fill="#fce4ec" stroke="#ad1457" stroke-width="1.5"/>
  <text x="915" y="358" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#880e4f">Backend Pod</text>
  <text x="915" y="373" text-anchor="middle" font-size="9" fill="#880e4f">10.1.2.51:8080</text>
  <text x="915" y="388" text-anchor="middle" font-size="9" fill="#2e7d32">Ready ✓</text>

  <rect x="985" y="338" width="110" height="65" rx="6" fill="#fce4ec" stroke="#ad1457" stroke-width="1.5"/>
  <text x="1040" y="358" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#880e4f">Backend Pod</text>
  <text x="1040" y="373" text-anchor="middle" font-size="9" fill="#880e4f">10.1.2.77:8080</text>
  <text x="1040" y="388" text-anchor="middle" font-size="9" fill="#2e7d32">Ready ✓</text>

  <rect x="1110" y="338" width="110" height="65" rx="6" fill="#fce4ec" stroke="#ad1457" stroke-width="1.5"/>
  <text x="1165" y="358" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#880e4f">Backend Pod</text>
  <text x="1165" y="373" text-anchor="middle" font-size="9" fill="#880e4f">10.1.3.19:8080</text>
  <text x="1165" y="388" text-anchor="middle" font-size="9" fill="#2e7d32">Ready ✓</text>

  <!-- Callout: no direct frontend->backend pod traffic -->
  <rect x="560" y="338" width="280" height="112" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="700" y="359" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#f57f17">Frontend pods never call</text>
  <text x="700" y="372" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#f57f17">Backend pods directly.</text>
  <text x="700" y="392" text-anchor="middle" font-size="9.5" fill="#8d6e00">The SPA's JS runs in the</text>
  <text x="700" y="405" text-anchor="middle" font-size="9.5" fill="#8d6e00">user's browser — /api/* calls</text>
  <text x="700" y="418" text-anchor="middle" font-size="9.5" fill="#8d6e00">go back out via the ALB,</text>
  <text x="700" y="431" text-anchor="middle" font-size="9.5" fill="#8d6e00">not through cluster networking.</text>

  <!-- Control plane container -->
  <rect x="70" y="470" width="1260" height="330" rx="10" fill="#fafafa" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="700" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#424242">Kubernetes Control Plane — reconciliation only, no application traffic flows here</text>

  <rect x="100" y="512" width="280" height="58" rx="6" fill="#ffffff" stroke="#616161" stroke-width="1.5"/>
  <text x="240" y="535" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#424242">Ingress: app-ingress</text>
  <text x="240" y="550" text-anchor="middle" font-size="9.5" fill="#616161">defines the routing rules shown on ALB above</text>

  <rect x="420" y="512" width="320" height="58" rx="6" fill="#ffffff" stroke="#616161" stroke-width="1.5"/>
  <text x="580" y="535" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#424242">AWS Load Balancer Controller</text>
  <text x="580" y="550" text-anchor="middle" font-size="9.5" fill="#616161">runs as a pod in kube-system</text>

  <line x1="380" y1="541" x2="418" y2="541" stroke="#757575" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>

  <rect x="100" y="600" width="280" height="50" rx="6" fill="#ffffff" stroke="#616161" stroke-width="1.5"/>
  <text x="240" y="620" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">Service: frontend-svc</text>
  <text x="240" y="634" text-anchor="middle" font-size="9.5" fill="#616161">ClusterIP, port 80</text>

  <rect x="420" y="600" width="320" height="50" rx="6" fill="#ffffff" stroke="#616161" stroke-width="1.5"/>
  <text x="580" y="620" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">Service: backend-svc</text>
  <text x="580" y="634" text-anchor="middle" font-size="9.5" fill="#616161">ClusterIP, port 8080</text>

  <line x1="240" y1="650" x2="240" y2="678" stroke="#757575" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <line x1="580" y1="650" x2="580" y2="678" stroke="#757575" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>

  <rect x="100" y="680" width="280" height="50" rx="6" fill="#ffffff" stroke="#616161" stroke-width="1.5"/>
  <text x="240" y="700" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">EndpointSlice (frontend)</text>
  <text x="240" y="714" text-anchor="middle" font-size="9.5" fill="#616161">tracks the 3 Ready pod IPs above</text>

  <rect x="420" y="680" width="320" height="50" rx="6" fill="#ffffff" stroke="#616161" stroke-width="1.5"/>
  <text x="580" y="700" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">EndpointSlice (backend)</text>
  <text x="580" y="714" text-anchor="middle" font-size="9.5" fill="#616161">tracks the 3 Ready pod IPs above</text>

  <path d="M240,678 C240,600 420,570 418,548" fill="none" stroke="#757575" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <path d="M580,678 C620,620 600,590 578,570" fill="none" stroke="#757575" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>

  <!-- Controller configures target groups (long dashed arrows around the margins) -->
  <path d="M560,512 C450,480 200,420 150,262" fill="none" stroke="#757575" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <text x="115" y="440" text-anchor="middle" font-size="9" fill="#616161" transform="rotate(-90 115 440)">configures target group membership</text>

  <path d="M700,512 C850,480 1100,420 1250,262" fill="none" stroke="#757575" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <text x="1285" y="440" text-anchor="middle" font-size="9" fill="#616161" transform="rotate(90 1285 440)">configures target group membership</text>

  <!-- Legend -->
  <line x1="70" y1="835" x2="105" y2="835" stroke="#212121" stroke-width="2" marker-end="url(#arrowBlack)"/>
  <text x="112" y="839" font-size="11" fill="#424242">Data plane — actual request/response traffic</text>
  <line x1="420" y1="835" x2="455" y2="835" stroke="#757575" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <text x="462" y="839" font-size="11" fill="#424242">Control plane — Kubernetes reconciliation, carries no traffic</text>

  <text x="700" y="865" text-anchor="middle" font-size="11" fill="#616161">Target type IP: pods have real VPC IPs (via VPC CNI), so the ALB targets them directly — bypassing kube-proxy/Service for the data path.</text>
  <text x="700" y="882" text-anchor="middle" font-size="11" fill="#616161">Only pods in Ready state (per their EndpointSlice entry) are registered as ALB targets — a failed liveness probe deregisters a pod automatically.</text>
  <text x="700" y="899" text-anchor="middle" font-size="11" fill="#616161">The ALB's health check here is the shallow liveness-style check (HTTP-only) — see network-traffic-diagram.svg for the deeper, DB-aware /readyz used by Route 53.</text>
</svg>
