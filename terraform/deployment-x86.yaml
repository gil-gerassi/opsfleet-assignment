# Forces pods onto Karpenter's "amd64" NodePool by matching the
# kubernetes.io/arch label Karpenter sets on every node it launches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-x86
  labels:
    app: hello-x86
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-x86
  template:
    metadata:
      labels:
        app: hello-x86
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: hello
          image: public.ecr.aws/nginx/nginx:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
